name: Python CI (syntax + tokenizer smoke)

on:
  push:
    branches: [ main, "copilot/**" ]
  pull_request:
    branches: [ main ]

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Syntax check (compileall)
        run: python -m compileall -q .
      - name: Tokenizer smoke
        run: |
          python - << 'PY'
          from utf8_tokenizer import UTF8PhonemeTokenizer
          tok = UTF8PhonemeTokenizer()
          enc = tok.encode("السلام")
          dec = tok.decode(enc)
          assert isinstance(enc, list) and len(enc) > 0
          assert isinstance(dec, str)
          print("Tokenizer smoke OK")
          PY
